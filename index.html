<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALKULATOR E-1</title>
    <style>
        :root {
            --primary: #1e293b;
            --primary-light: #334155;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: #1e293b;
            --input-bg: #0f172a;
            --border: #334155;
            --border-focus: #38bdf8;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
            --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.5);
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text);
            background: var(--bg-gradient);
            margin: 0;
            padding: 16px;
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 20px;
            color: var(--text);
            text-align: center;
            margin: 0 0 24px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            position: relative;
            padding-bottom: 10px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
        }

        #input-page {
            max-width: 440px;
            margin: 30px auto;
            background: #0f172a;
            border: 1px solid var(--border);
            padding: 32px;
            border-radius: 10px;
            box-shadow: var(--shadow-md);
        }

        #input-page h3 {
            margin: 0 0 20px 0;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .grid-inputs-vertical {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }

        .input-group input {
            padding: 10px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            text-align: center;
            width: 100%;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--border-focus);
            background: #1e293b;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .btn-enter {
            width: 100%;
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: var(--shadow-sm);
        }

        .btn-enter:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-enter:active {
            transform: translateY(0);
        }

        .business-process {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px dashed var(--border);
            font-size: 12px;
            color: var(--text-muted);
            text-align: left;
        }

        .business-process p {
            margin: 0 0 6px 0;
            font-weight: 600;
            color: var(--text);
        }

        .business-process ul {
            margin: 0;
            padding-left: 18px;
        }

        .business-process li {
            margin-bottom: 4px;
        }

        #result-page {
            display: none;
            width: 100%;
        }

        .top-bar-result {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 16px;
        }

        .btn-back {
            background-color: #334155;
            color: var(--text);
            border: none;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        .btn-back:hover {
            background-color: #475569;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
            background: #0f172a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            white-space: nowrap;
            color: var(--text);
            min-width: 800px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 10px 14px;
            vertical-align: middle;
        }

        th {
            background-color: #0f172a;
            color: var(--text);
            text-align: center;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .group-row {
            background-color: #334155;
            font-weight: 700;
            color: #f8fafc;
        }

        .subtotal-row {
            background-color: #1e293b;
            font-weight: 700;
            color: var(--text);
        }

        .total-row {
            background-color: #0f172a;
            font-weight: 700;
            font-size: 13px;
            color: var(--accent);
        }

        .text-center { text-align: center; }
        .text-right { text-align: right; }

        .price-input {
            width: 100%;
            max-width: 125px;
            padding: 6px 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            text-align: center;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            display: inline-block;
            margin: 0 auto;
        }

        .price-input:focus {
            outline: none;
            border-color: var(--border-focus);
            background: #1e293b;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .action-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 16px;
        }

        button.print-btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        button.print-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            body { padding: 6px; }
            .container { padding: 12px; border-radius: 8px; }
            h1 { font-size: 16px; margin-bottom: 16px; }
            #input-page { margin: 10px auto; padding: 20px; }
            table { font-size: 11px; }
            th, td { padding: 8px 10px; }
            .price-input { max-width: 105px; font-size: 11px; }
        }

        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            body { background: white; color: black; padding: 0; font-size: 11px; }
            .container { border: none; padding: 0; max-width: 100%; box-shadow: none; background: white; }
            #input-page, .top-bar-result, .action-bar { display: none !important; }
            #result-page { display: block !important; }
            input::-webkit-outer-spin-button,
            input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
            input[type=number] { -moz-appearance: textfield; }
            .price-input { border: none; background: transparent; color: #000; padding: 0; width: auto; text-align: right; }
            .table-responsive { overflow: visible; border: none; box-shadow: none; background: white; }
            table { font-size: 10px; color: black; min-width: 100%; }
            th { background-color: #1e3a5f !important; color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .group-row { background-color: #e2e8f0 !important; color: black !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .subtotal-row { background-color: #f1f5f9 !important; color: black !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .total-row { background-color: #d9e2ec !important; color: black !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            th, td { border: 1px solid #94a3b8; padding: 4px 6px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>KALKULATOR E-1</h1>

    <div id="input-page">
        <h3>Parameter Kegiatan</h3>
        <div class="grid-inputs-vertical">
            <div class="input-group">
                <label>Peserta</label>
                <input type="number" id="p_peserta" value="" min="1">
            </div>
            <div class="input-group">
                <label>Pemateri</label>
                <input type="number" id="p_pemateri" value="" min="1">
            </div>
            <div class="input-group">
                <label>Anggota / Panitia</label>
                <input type="number" id="p_panitia" value="" min="1">
            </div>
            <div class="input-group">
                <label>Durasi Pelatihan</label>
                <input type="number" id="p_hari" value="" min="1" oninput="updateJPOtomatis()">
            </div>
            <div class="input-group">
                <label>Total JP Pemateri</label>
                <input type="number" id="p_jp" value="" min="1">
            </div>
        </div>
        
        <button class="btn-enter" onclick="prosesKeHalamanHasil()">ENTER</button>

        <div class="business-process">
            <p>Proses bisnis:</p>
            <ul>
                <li>PPTK konsultasi 2 hr</li>
                <li>PPTK & Anggota persiapan 1 hari</li>
                <li>Hari Kegiatan</li>
            </ul>
        </div>
    </div>

    <div id="result-page">
        <div class="top-bar-result">
            <button class="btn-back" onclick="kembaliKeInput()">← Kembali</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 6%;">No.</th>
                        <th style="width: 38%;">Uraian</th>
                        <th style="width: 6%;">Vol 1</th>
                        <th style="width: 5%;">Sat 1</th>
                        <th style="width: 6%;">Vol 2</th>
                        <th style="width: 5%;">Sat 2</th>
                        <th style="width: 7%;">Total</th>
                        <th style="width: 6%;">Satuan</th>
                        <th style="width: 12%;">Harga</th>
                        <th style="width: 13%;">Jumlah (Rp)</th>
                    </tr>
                </thead>
                <tbody id="rka-body"></tbody>
            </table>
        </div>

        <div class="action-bar">
            <button class="print-btn" onclick="window.print()">Cetak</button>
        </div>
    </div>
</div>

<script>
const tarif = {
    spanduk: 400000,
    penggandaan: 20000,
    pptk_honor: 1000000,
    pptk_trans: 5300000,
    pptk_harian_3hr: 480000,
    pptk_hotel_3hr: 967000,
    pptk_harian_fb: 160000,
    pptk_hotel_fb: 900000,
    pemateri_honor: 500000,
    pemateri_trans: 530000,
    pemateri_hotel: 900000,
    mc_honor: 700000,
    mc_trans: 530000,
    mc_hotel: 900000,
    doa_honor: 400000,
    peserta_trans: 530000,
    peserta_harian: 160000,
    peserta_hotel: 900000,
    panitia_honor: 300000,
    panitia_trans: 530000,
    panitia_hotel_1hr: 967000,
    panitia_harian_1hr: 480000,
    panitia_harian_fb: 160000,
    panitia_hotel_fb: 900000,
    lain_persen: 5
};

function formatRupiah(angka) {
    return new Intl.NumberFormat('id-ID').format(Math.round(angka));
}

function ubahTarif(key, val) {
    let nilai = parseFloat(val) || 0;
    if (key === 'lain_persen') {
        if (nilai > 25) {
            alert('Nilai maksimal adalah 25%');
            nilai = 25;
            document.getElementById('input_lain_persen').value = 25;
        } else if (nilai < 0) {
            nilai = 0;
        }
    }
    tarif[key] = nilai;
    hitungRKA(); 
}

function updateJPOtomatis() {
    const hari = document.getElementById('p_hari').value;
    if (hari === "" || parseInt(hari) < 0) {
        document.getElementById('p_jp').value = "";
    } else {
        document.getElementById('p_jp').value = parseInt(hari) * 8;
    }
}

function prosesKeHalamanHasil() {
    const peserta = document.getElementById('p_peserta').value;
    const pemateri = document.getElementById('p_pemateri').value;
    const panitia = document.getElementById('p_panitia').value;
    const hari = document.getElementById('p_hari').value;
    const jp = document.getElementById('p_jp').value;

    if (peserta === "" || pemateri === "" || panitia === "" || hari === "" || jp === "") {
        alert("Mohon isi semua parameter terlebih dahulu!");
        return;
    }

    document.getElementById('input-page').style.display = 'none';
    document.getElementById('result-page').style.display = 'block';
    hitungRKA();
}

function kembaliKeInput() {
    document.getElementById('result-page').style.display = 'none';
    document.getElementById('input-page').style.display = 'block';
}

function hitungRKA() {
    const peserta = parseInt(document.getElementById('p_peserta').value) || 0;
    const pemateri = parseInt(document.getElementById('p_pemateri').value) || 0;
    const panitia = parseInt(document.getElementById('p_panitia').value) || 0;
    const hari = parseInt(document.getElementById('p_hari').value) || 0;
    const jp = parseInt(document.getElementById('p_jp').value) || 0;

    const pptk = 1;
    const mc = 1;
    const doa = 1; 
    const adaKegiatan = 1;
    const totalPenggandaan = peserta + pptk + mc + panitia;

    const c_spanduk = adaKegiatan * tarif.spanduk;
    const c_penggandaan = totalPenggandaan * tarif.penggandaan;
    const totalBarangCetak = c_spanduk + c_penggandaan;

    const c_pptk_honor = pptk * tarif.pptk_honor;
    const c_pptk_trans = (pptk * 2) * tarif.pptk_trans;
    const c_pptk_harian3 = (pptk * 3) * tarif.pptk_harian_3hr;
    const c_pptk_hotel3 = (pptk * 3) * tarif.pptk_hotel_3hr;
    const c_pptk_harian_fb = (pptk * hari) * tarif.pptk_harian_fb;
    const c_pptk_hotel_fb = (pptk * hari) * tarif.pptk_hotel_fb;
    const totalBelanjaPPTK = c_pptk_honor + c_pptk_trans + c_pptk_harian3 + c_pptk_hotel3 + c_pptk_harian_fb + c_pptk_hotel_fb;

    const t_pemateri = pemateri * jp;
    const c_pemateri_honor = t_pemateri * tarif.pemateri_honor;
    const c_pemateri_trans = pemateri * tarif.pemateri_trans;
    const c_pemateri_hotel = (pemateri * hari) * tarif.pemateri_hotel;
    const totalBelanjaNarasumber = c_pemateri_honor + c_pemateri_trans + c_pemateri_hotel;

    const c_mc_honor = mc * tarif.mc_honor;
    const c_mc_trans = mc * tarif.mc_trans;
    const c_mc_hotel = (mc * hari) * tarif.mc_hotel;
    const totalBelanjaMC = c_mc_honor + c_mc_trans + c_mc_hotel;

    const c_pan_honor = panitia * tarif.panitia_honor;
    const c_pan_trans = panitia * tarif.panitia_trans;
    const c_pan_hotel1 = (panitia * 1) * tarif.panitia_hotel_1hr;
    const c_pan_harian1 = (panitia * 1) * tarif.panitia_harian_1hr;
    const c_pan_harian_fb = (panitia * hari) * tarif.panitia_harian_fb;
    const c_pan_paket_fb = (panitia * hari) * tarif.panitia_hotel_fb;
    const totalBelanjaPanitia = c_pan_honor + c_pan_trans + c_pan_hotel1 + c_pan_harian1 + c_pan_harian_fb + c_pan_paket_fb;

    const c_peserta_trans = peserta * tarif.peserta_trans;
    const c_peserta_harian = (peserta * hari) * tarif.peserta_harian;
    const c_peserta_hotel = (peserta * hari) * tarif.peserta_hotel;
    const c_doa_honor = doa * tarif.doa_honor;
    const totalBelanjaPeserta = c_peserta_trans + c_peserta_harian + c_peserta_hotel + c_doa_honor;

    const subTotalPokok = totalBarangCetak + totalBelanjaPPTK + totalBelanjaNarasumber + totalBelanjaMC + totalBelanjaPanitia + totalBelanjaPeserta;
    
    let persenAktif = tarif.lain_persen > 25 ? 25 : tarif.lain_persen;
    const c_lain = subTotalPokok * (persenAktif / 100);
    const grandTotal = subTotalPokok + c_lain;

    const html = `
        <tr class="group-row">
            <td class="text-center">1</td>
            <td colspan="9">BARANG CETAK</td>
        </tr>
        <tr>
            <td class="text-center">1.1</td>
            <td>Spanduk</td>
            <td class="text-center">${adaKegiatan}</td><td class="text-center">Buah</td>
            <td class="text-center">${adaKegiatan}</td><td class="text-center">Keg</td>
            <td class="text-center">${adaKegiatan}</td><td class="text-center">Buah</td>
            <td class="text-center"><input type="number" class="price-input" value="${tarif.spanduk}" onchange="ubahTarif('spanduk', this.value)"></td>
            <td class="text-right"><b>Rp ${formatRupiah(c_spanduk)}</b></td>
        </tr>
        <tr>
            <td class="text-center">1.2</td>
            <td>Penggandaan</td>
            <td class="text-center">${totalPenggandaan}</td><td class="text-center">Org</td>
            <td class="text-center">${totalPenggandaan > 0 ? 1 : 0}</td><td class="text-center">Paket</td>
            <td class="text-center">${totalPenggandaan}</td><td class="text-center">Paket</td>
            <td class="text-center"><input type="number" class="price-input" value="${tarif.penggandaan}" onchange="ubahTarif('penggandaan', this.value)"></td>
            <td class="text-right"><b>Rp ${formatRupiah(c_penggandaan)}</b></td>
        </tr>
        <tr class="subtotal-row">
            <td colspan="9" class="text-right">SUB TOTAL 1</td>
            <td class="text-right">Rp ${formatRupiah(totalBarangCetak)}</td>
        </tr>

        <tr class="group-row">
            <td class="text-center">2</td>
            <td colspan="9">BELANJA PPTK</td>
        </tr>
        <tr>
            <td class="text-center">2.1</td>
            <td>Honorarium</td>
            <td class="text-center">${pptk}</td><td class="text-center">Org</td>
            <td class="text-center">1</td><td class="text-center">Keg</td>
            <td class="text-center">${pptk}</td><td class="text-center">OK</td>
            <td class="text-center"><input type="number" class="price-input" value="${tarif.pptk_honor}" onchange="ubahTarif('pptk_honor', this.value)"></td>
            <td class="text-right"><b>Rp ${formatRupiah(c_pptk_honor)}</b></td>
        </tr>
        <tr>
            <td class="text-center">2.2</td>
            <td>Transportasi</td>
            <td class="text-center">${pptk}</td><td class="text-center">Org</td>
            <td class="text-center">2</td><td class="text-center">Kali</td>
            <td class="text-center">${pptk * 2}</td><td class="text-center">PP</td>
            <td class="text-center"><input type="number" class="price-input" value="${tarif.pptk_trans}" onchange="ubahTarif('pptk_trans', this.value)"></td>
            <td class="text-right"><b>Rp ${formatRupiah(c_pptk_trans)}</b></td>
        </tr>
        <tr>
            <td class="text-center">2.3</td>
            <td>Uang Harian</td>
            <td class="text-center">${pptk}</td><td class="text-center">Org</td>
            <td class="text-center">3</td><td class="text-center">Hari</td>
            <td class="text-center">${pptk * 3}</td><td class="text-center">OH</td>
            <td class="text-center"><input type="number" class="price-input" value="${tarif.pptk_harian_3hr}" onchange="ubahTarif('pptk_harian_3hr', this.value)"></td>
            <td class="text-right"><b>Rp ${formatRupiah(c_pptk_harian3)}</b></td>
        </tr>
        <tr>
            <td class="text-center">2.4</td>
            <td>Uang Hotel</td>
            <td class="text-center">${pptk}</td><td class="text-center">Org</td>
            <td class="text-center">3</td><td class="text-center">Malam</td>
            <td class="text-center">${pptk * 3}</td><td class="text-center">OP</td>
            <td class="text-center"><input type="number" class="price-input" value="${tarif.pptk_hotel_3hr}" onchange="ubahTarif('pptk_hotel_3hr', this.value)"></td>
            <td class="text-right"><b>Rp ${formatRupiah(c_pptk_hotel3)}</b></td>
        </tr>
        <tr>
            <td class="text-center">2.5</td>
            <td>Uang Harian Fullboard</td>
            <td class="text-center">${pptk}</td><td class="text-center">Org</td>
            <td class="text-center">${hari}</td><td class="text-center">Hari</td>
            <td class="text-center">${pptk * hari}</td><td class="text-center">OH</td>
            <td class="text-center"><input type="number" class="price-input" value="${tarif.pptk_harian_fb}" onchange="ubahTarif('pptk_harian_fb', this.value)"></td>
            <td class="text-right"><b>Rp ${formatRupiah(c_pptk_harian_fb)}</b></td>
        </tr>
        <tr>
            <td class="text-center">2.6</td>
            <td>Paket Rapat Fullboard</td>
